name: Windows Agent CI

on:
  push:
    branches: [main]
    paths:
      - "src/windows-client/**"
      - ".github/workflows/agent-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/windows-client/**"
      - ".github/workflows/agent-ci.yml"

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        working-directory: src/windows-client
        run: dotnet restore EasyPanel.WindowsClient.slnx

      - name: Build (zero warnings)
        working-directory: src/windows-client
        run: dotnet build EasyPanel.WindowsClient.slnx --configuration Release --no-restore

      - name: Test
        working-directory: src/windows-client
        run: dotnet test EasyPanel.WindowsClient.slnx --configuration Release --no-build --logger "console;verbosity=normal"
