# =============================================================================
# EasyPanel — Docker Compose (base)  — Requisitos R1.1, R1.2, R1.7
#
# Serviços: api, postgres, redis, minio, caddy (reverse proxy), otel-collector,
# prometheus, loki, grafana, frontend.
#
# Este arquivo é o baseline compartilhado por todos os ambientes. Overrides:
#   - docker-compose.override.yml  -> development (aplicado automaticamente)
#   - docker-compose.staging.yml   -> staging  (docker compose -f ... -f staging)
#   - docker-compose.prod.yml      -> production
#
# Segredos NUNCA são versionados: os valores vêm de variáveis de ambiente /
# arquivo .env (ver .env.example) — R1.6.
# =============================================================================

name: easypanel

services:
  # ---- Backend (.NET 10 / ASP.NET Core Web API) -----------------------------
  api:
    build:
      # Contexto na raiz do repositório para acessar toda a solução.
      context: ..
      dockerfile: src/EasyPanel.Api/Dockerfile
    image: easypanel/api:${API_IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:8080
      # Connection string do PostgreSQL montada a partir das variáveis do .env
      # (chave de configuração Database:ConnectionString -> Database__ConnectionString).
      Database__ConnectionString: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-easypanel};Username=${POSTGRES_USER:-easypanel};Password=${POSTGRES_PASSWORD}"
      Database__ApplyMigrationsOnStartup: "true"
      # Redis e S3/MinIO (usados por fases posteriores; provisionados na Fase 1).
      Redis__ConnectionString: "redis:6379,password=${REDIS_PASSWORD}"
      Storage__Endpoint: "http://minio:9000"
      Storage__AccessKey: ${MINIO_ROOT_USER:-easypanel}
      Storage__SecretKey: ${MINIO_ROOT_PASSWORD}
      Storage__Bucket: ${MINIO_BUCKET:-easypanel}
      # JWT / segredos de autenticação.
      Jwt__Issuer: ${JWT_ISSUER:-easypanel}
      Jwt__Audience: ${JWT_AUDIENCE:-easypanel}
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
      # Bootstrap do primeiro acesso (Super Admin) — ver docs/DEPLOYMENT.md.
      # Deixe ambos em branco no .env para não criar nenhum usuário automaticamente.
      Bootstrap__SuperAdminEmail: ${BOOTSTRAP_SUPERADMIN_EMAIL:-}
      Bootstrap__SuperAdminPassword: ${BOOTSTRAP_SUPERADMIN_PASSWORD:-}
      # Observabilidade: OpenTelemetry -> collector.
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
      OTEL_SERVICE_NAME: easypanel-api
    expose:
      - "8080"
    networks:
      - edge
      - backend

  # ---- PostgreSQL -----------------------------------------------------------
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-easypanel}
      POSTGRES_USER: ${POSTGRES_USER:-easypanel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-easypanel} -d ${POSTGRES_DB:-easypanel}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - backend

  # ---- Redis ----------------------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks:
      - backend

  # ---- MinIO (armazenamento compatível com S3) ------------------------------
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-easypanel}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - backend

  # ---- Caddy (reverse proxy + TLS) — R1.7 -----------------------------------
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
    environment:
      # Domínio servido; em development usa-se localhost (ver override).
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      API_UPSTREAM: api:8080
      FRONTEND_UPSTREAM: frontend:80
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - edge

  # ---- Frontend (build estático React servido por Nginx) --------------------
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    image: easypanel/frontend:${FRONTEND_IMAGE_TAG:-latest}
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - edge

  # ---- OpenTelemetry Collector ----------------------------------------------
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    restart: unless-stopped
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./observability/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    expose:
      - "4317" # OTLP gRPC
      - "4318" # OTLP HTTP
    networks:
      - backend

  # ---- Prometheus -----------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    expose:
      - "9090"
    networks:
      - backend

  # ---- Loki (agregação de logs) ---------------------------------------------
  loki:
    image: grafana/loki:latest
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    volumes:
      - ./observability/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    expose:
      - "3100"
    networks:
      - backend

  # ---- Grafana --------------------------------------------------------------
  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    depends_on:
      - prometheus
      - loki
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
    expose:
      - "3000"
    networks:
      - backend

networks:
  edge:
    driver: bridge
  backend:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  minio-data:
  prometheus-data:
  loki-data:
  grafana-data:
  caddy-data:
  caddy-config:
